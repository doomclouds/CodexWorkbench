syntax = "proto3";

package luming.studio.v1;

service BoardCatalogService {
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);
  rpc ListTrashedBoards(ListTrashedBoardsRequest) returns (ListTrashedBoardsResponse);
  rpc GetBoardThumbnail(GetBoardThumbnailRequest) returns (GetBoardThumbnailResponse);
  rpc CreateBoard(CreateBoardRequest) returns (CreateBoardResponse);
  rpc DuplicateBoard(DuplicateBoardRequest) returns (DuplicateBoardResponse);
  rpc ManageBoard(ManageBoardRequest) returns (ManageBoardResponse);
  rpc PurgeBoards(PurgeBoardsRequest) returns (PurgeBoardsResponse);
  rpc GetCatalogCommandReceipt(GetCatalogCommandReceiptRequest) returns (GetCatalogCommandReceiptResponse);
}

enum BoardSortOrder {
  BOARD_SORT_ORDER_UNSPECIFIED = 0;
  BOARD_SORT_ORDER_RECENT = 1;
  BOARD_SORT_ORDER_TITLE = 2;
}

message BoardSummary {
  string board_id = 1;
  string title = 2;
  optional uint64 updated_at_millis = 3;
  bool pinned = 4;
  optional uint64 entry_version = 5;
  bool can_manage = 6;
  optional uint64 preview_revision = 7;
}

message ListBoardsRequest {
  string query = 1;
  BoardSortOrder order = 2;
  uint32 page_size = 3;
  optional string cursor = 4;
  bool pinned_only = 5;
}

message ListBoardsResponse {
  repeated BoardSummary boards = 1;
  optional string next_cursor = 2;
}

message TrashedBoardSummary {
  BoardSummary board = 1;
  uint64 trashed_at_millis = 2;
}

message ListTrashedBoardsRequest {
  string query = 1;
  BoardSortOrder order = 2;
  uint32 page_size = 3;
  optional string cursor = 4;
}

message ListTrashedBoardsResponse {
  repeated TrashedBoardSummary boards = 1;
  optional string next_cursor = 2;
}

message GetBoardThumbnailRequest {
  string board_id = 1;
  optional uint64 revision = 2;
  bool trashed = 3;
}

message GetBoardThumbnailResponse {
  BoardThumbnail thumbnail = 1;
}

message BoardThumbnail {
  optional uint64 revision = 1;
  string mime_type = 2;
  bytes content = 3;
}

message CreateBoardRequest {
  string command_id = 1;
  string title = 2;
}

message CreateBoardResponse {
  CatalogCommandReceipt receipt = 1;
}

message DuplicateBoardRequest {
  string command_id = 1;
  string source_board_id = 2;
}

message DuplicateBoardResponse {
  CatalogCommandReceipt receipt = 1;
}

enum BoardLifecycleAction {
  BOARD_LIFECYCLE_ACTION_UNSPECIFIED = 0;
  BOARD_LIFECYCLE_ACTION_TRASH = 1;
  BOARD_LIFECYCLE_ACTION_RESTORE = 2;
}

message ManageBoardRequest {
  string command_id = 1;
  string board_id = 2;
  optional uint64 expected_entry_version = 3;
  oneof operation {
    string title = 4;
    bool pinned = 5;
    BoardLifecycleAction lifecycle = 6;
  }
}

message ManageBoardResponse {
  CatalogCommandReceipt receipt = 1;
}

message PurgeBoardTarget {
  string board_id = 1;
  optional uint64 expected_entry_version = 2;
}

message PurgeBoardsRequest {
  string command_id = 1;
  repeated PurgeBoardTarget targets = 2;
}

message PurgeBoardsResponse {
  CatalogCommandReceipt receipt = 1;
}

message CatalogPurgeItemResult {
  string board_id = 1;
  oneof outcome {
    bool deleted = 2;
    CatalogRejection rejected = 3;
  }
}

message CatalogPurgeResult {
  repeated CatalogPurgeItemResult items = 1;
}

message CatalogCommandReceipt {
  string command_id = 1;
  oneof outcome {
    BoardSummary created = 2;
    CatalogRejection rejected = 3;
    BoardSummary changed = 4;
    CatalogPurgeResult purged = 5;
  }
}

enum CatalogRejectionReason {
  CATALOG_REJECTION_REASON_UNSPECIFIED = 0;
  CATALOG_REJECTION_REASON_INVALID_TITLE = 1;
  CATALOG_REJECTION_REASON_COMMAND_ID_REUSE = 2;
  CATALOG_REJECTION_REASON_FORBIDDEN = 3;
  CATALOG_REJECTION_REASON_ENTRY_VERSION_CHANGED = 4;
  CATALOG_REJECTION_REASON_STATE_CHANGED = 5;
  CATALOG_REJECTION_REASON_INVALID_COMMAND = 6;
}

message CatalogRejection {
  CatalogRejectionReason reason = 1;
}

message GetCatalogCommandReceiptRequest {
  string command_id = 1;
}

message CatalogReceiptNotRecorded {
  string command_id = 1;
}

message GetCatalogCommandReceiptResponse {
  oneof result {
    CatalogCommandReceipt receipt = 1;
    CatalogReceiptNotRecorded not_recorded = 2;
  }
}
