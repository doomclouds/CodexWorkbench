syntax = "proto3";

package luming.studio.v1;

import "google/protobuf/struct.proto";
import "luming/studio/v1/whiteboard_payload.proto";
import "luming/studio/v1/whiteboard_scene.proto";
import "luming/studio/v1/whiteboard_service.proto";

service BoardEditService {
  rpc EditBoardGeometry(EditBoardGeometryRequest) returns (EditBoardGeometryResponse);
  rpc EditObjectContent(EditObjectContentRequest) returns (EditObjectContentResponse);
  rpc AttachBoardImage(AttachBoardImageRequest) returns (AttachBoardImageResponse);
  rpc AttachBoardVideo(AttachBoardVideoRequest) returns (AttachBoardVideoResponse);
  rpc UploadBoardDocumentImage(UploadBoardDocumentImageRequest) returns (UploadBoardDocumentImageResponse);
  rpc ReverseBoardEdit(ReverseBoardEditRequest) returns (ReverseBoardEditResponse);
  rpc GetBoardEditReceipt(GetBoardEditReceiptRequest) returns (GetBoardEditReceiptResponse);
}

message EditBoardGeometryRequest {
  string board_id = 1;
  string command_id = 2;
  oneof operation {
    CreateBoardObject create = 3;
    TransformBoardObjects transform = 4;
    ChangeBoardObjectLock change_lock = 5;
    DeleteBoardObjects delete = 6;
    ReorderBoardObjects reorder = 7;
    DuplicateBoardObjects duplicate = 8;
    GroupBoardObjects group = 9;
    UngroupBoardObjects ungroup = 10;
    CreateSelectionSection create_section = 11;
    ArrangeBoardObjects arrange = 12;
    ChangeBoardObjectStyle style = 13;
    PasteBoardObjects paste = 14;
    RemoveBoardCustomColor remove_custom_color = 15;
  }
}

message CreateBoardObject {
  ObjectMetadata object = 1;
  ObjectPayload initial_payload = 2;
  BoardCreationAttachment attachment = 3;
}

message BoardCreationAttachment {
  EditBoardTarget source = 1;
  ConnectorPort source_port = 2;
  ConnectorPort target_port = 3;
  string connector_id = 4;
  optional string stroke = 5;
  optional double stroke_width = 6;
}

message EditBoardTarget {
  string object_id = 1;
  optional uint64 expected_geometry_version = 2;
}

message TransformBoardObject {
  EditBoardTarget target = 1;
  Geometry geometry = 2;
  ConnectorGeometry connector = 3;
  InkPayload ink = 4;
}

enum BoardTransformKind {
  BOARD_TRANSFORM_KIND_UNSPECIFIED = 0;
  BOARD_TRANSFORM_KIND_RESIZE = 1;
  BOARD_TRANSFORM_KIND_ROTATE = 2;
  BOARD_TRANSFORM_KIND_CONNECT = 3;
}

message TransformBoardObjects {
  BoardTransformKind kind = 1;
  repeated TransformBoardObject objects = 2;
}

message ChangeBoardObjectLock {
  repeated EditBoardTarget targets = 1;
  bool locked = 2;
}

message DeleteBoardObjects {
  repeated EditBoardTarget targets = 1;
}

enum BoardLayerDirection {
  BOARD_LAYER_DIRECTION_UNSPECIFIED = 0;
  BOARD_LAYER_DIRECTION_FORWARD = 1;
  BOARD_LAYER_DIRECTION_BACKWARD = 2;
  BOARD_LAYER_DIRECTION_FRONT = 3;
  BOARD_LAYER_DIRECTION_BACK = 4;
}

message ReorderBoardObjects {
  repeated EditBoardTarget targets = 1;
  BoardLayerDirection direction = 2;
  optional uint64 expected_board_revision = 3;
}

message DuplicateBoardObject {
  EditBoardTarget source = 1;
  string new_object_id = 2;
}

message DuplicateBoardObjects {
  repeated DuplicateBoardObject targets = 1;
  MoveDelta delta = 2;
}

message GroupBoardObjects {
  repeated EditBoardTarget targets = 1;
  string group_id = 2;
}

message UngroupBoardObjects {
  repeated EditBoardTarget targets = 1;
}

message CreateSelectionSection {
  repeated EditBoardTarget targets = 1;
  string section_id = 2;
  optional string title = 3;
}

enum BoardArrangePreset {
  BOARD_ARRANGE_PRESET_UNSPECIFIED = 0;
  BOARD_ARRANGE_PRESET_TIDY = 1;
  BOARD_ARRANGE_PRESET_LEFT = 2;
  BOARD_ARRANGE_PRESET_HCENTER = 3;
  BOARD_ARRANGE_PRESET_RIGHT = 4;
  BOARD_ARRANGE_PRESET_TOP = 5;
  BOARD_ARRANGE_PRESET_VCENTER = 6;
  BOARD_ARRANGE_PRESET_BOTTOM = 7;
}

message ArrangeBoardObjects {
  repeated EditBoardTarget targets = 1;
  BoardArrangePreset preset = 2;
}

message BoardObjectStyleTarget {
  EditBoardTarget target = 1;
  optional uint64 expected_payload_version = 2;
}

message BoardObjectStylePatch {
  optional string fill = 1;
  optional string stroke = 2;
  optional double stroke_width = 3;
  optional bool dashed = 4;
  optional bool hollow = 5;
  optional string text_color = 6;
  optional string font_family = 7;
  optional double font_size = 8;
  optional TextAlignment text_align = 9;
  optional string shape_form = 10;
  optional ConnectorHead start_head = 11;
  optional ConnectorHead end_head = 12;
  optional string label = 13;
  optional bool bold = 14;
  optional bool italic = 15;
}

message ChangeBoardObjectStyle {
  repeated BoardObjectStyleTarget targets = 1;
  BoardObjectStylePatch patch = 2;
  optional string remember_color = 3;
}

message RemoveBoardCustomColor {
  string color = 1;
}

message PasteBoardObject {
  string source_object_id = 1;
  string object_id = 2;
}

message PasteBoardObjects {
  string source_board_id = 1;
  optional uint64 source_revision = 2;
  repeated PasteBoardObject targets = 3;
  MoveDelta delta = 4;
}

message EditBoardGeometryResponse {
  BoardEditReceipt receipt = 1;
}

message EditObjectContentRequest {
  string board_id = 1;
  string command_id = 2;
  string object_id = 3;
  optional uint64 expected_payload_version = 4;
  oneof edit {
    DocumentPayload document = 5;
    TodoEdits todo = 6;
    TextPayload text = 7;
    SaveTableContent table = 8;
    SaveEmbedSource embed_source = 9;
    SaveEmbedState embed_state = 10;
    SelectStickerContent sticker = 11;
    CropBoardImage crop = 12;
    SaveBoardLink link = 13;
  }
  optional bool delete_empty_text = 14;
}

message SaveBoardLink {
  string title = 1;
  string href = 2;
}

message SaveTableContent {
  TablePayload table = 1;
  TableWidthChange width_change = 2;
}

message TableWidthChange {
  double expected_width = 1;
  double width = 2;
}

message SaveEmbedSource {
  string title = 1;
  string html = 2;
  optional uint64 expected_source_revision = 3;
}

message SaveEmbedState {
  google.protobuf.Value state = 1;
}

message SelectStickerContent {
  string sticker_id = 1;
  optional string fallback = 2;
}

message CropBoardImage {
  ImageCrop crop = 1;
  ImageSize natural_size = 2;
}

message TodoEdits {
  repeated TodoEdit edits = 1;
}

message TodoEdit {
  oneof operation {
    string rename = 1;
    InsertTodoItem insert = 2;
    UpdateTodoItem update = 3;
    string delete_item_id = 4;
    MoveTodoItem move = 5;
  }
}

message TodoPlacement {
  oneof position {
    bool first = 1;
    bool append = 2;
    string after_item_id = 3;
  }
}

message InsertTodoItem {
  TodoItem item = 1;
  TodoPlacement placement = 2;
}

message UpdateTodoItem {
  string item_id = 1;
  optional string text = 2;
  optional bool checked = 3;
  oneof source_change {
    TodoSourceRef source_ref = 4;
    bool clear_source = 5;
  }
}

message MoveTodoItem {
  string item_id = 1;
  TodoPlacement placement = 2;
}

message EditObjectContentResponse {
  BoardEditReceipt receipt = 1;
}

message AttachBoardImageRequest {
  string board_id = 1;
  string command_id = 2;
  string object_id = 3;
  string display_name = 4;
  Geometry geometry = 5;
  bytes content = 6;
}

message AttachBoardImageResponse {
  BoardEditReceipt receipt = 1;
}

message AttachBoardVideoRequest {
  string board_id = 1;
  string command_id = 2;
  string object_id = 3;
  string display_name = 4;
  Geometry geometry = 5;
  bytes content = 6;
  string media_type = 7;
}

message AttachBoardVideoResponse {
  BoardEditReceipt receipt = 1;
}

message UploadBoardDocumentImageRequest {
  string board_id = 1;
  string command_id = 2;
  string object_id = 3;
  bytes content = 4;
}

message UploadBoardDocumentImageResponse {
  BoardEditReceipt receipt = 1;
  optional string asset_url = 2;
}

message ReverseBoardEditRequest {
  string board_id = 1;
  string command_id = 2;
  oneof source {
    string edit_command_id = 3;
    string move_command_id = 4;
  }
}

message ReverseBoardEditResponse {
  BoardEditReceipt receipt = 1;
}

message BoardEditReceipt {
  string board_id = 1;
  string command_id = 2;
  oneof outcome {
    BoardEditApplied applied = 3;
    BoardEditConflict conflict = 4;
    BoardEditRejected rejected = 5;
  }
}

message BoardEditApplied {
  optional uint64 board_revision = 1;
  repeated ObjectMetadata changed_objects = 2;
  repeated string removed_object_ids = 3;
  repeated string object_order = 4;
  repeated ObjectPayloadResult changed_payloads = 5;
  bool details_expired = 6;
  BoardCustomColors custom_colors = 7;
}

message BoardEditConflict {
  optional uint64 board_revision = 1;
  repeated ObjectMetadata current_objects = 2;
  repeated ObjectPayloadResult current_payloads = 3;
}

message BoardEditRejected {
  BoardEditRejectionReason reason = 1;
}

enum BoardEditRejectionReason {
  BOARD_EDIT_REJECTION_REASON_UNSPECIFIED = 0;
  BOARD_EDIT_REJECTION_REASON_FORBIDDEN = 1;
  BOARD_EDIT_REJECTION_REASON_INVALID_EDIT = 2;
  BOARD_EDIT_REJECTION_REASON_OBJECT_NOT_FOUND = 3;
  BOARD_EDIT_REJECTION_REASON_GEOMETRY_LOCKED = 4;
  BOARD_EDIT_REJECTION_REASON_COMMAND_ID_REUSE = 5;
  BOARD_EDIT_REJECTION_REASON_UNSUPPORTED_KIND = 6;
  BOARD_EDIT_REJECTION_REASON_VERSION_UNAVAILABLE = 7;
  BOARD_EDIT_REJECTION_REASON_TOO_LARGE = 8;
  BOARD_EDIT_REJECTION_REASON_INVALID_IMAGE = 9;
  BOARD_EDIT_REJECTION_REASON_INVALID_VIDEO = 10;
  BOARD_EDIT_REJECTION_REASON_INLINE_HTML_RESOURCE = 11;
}

message GetBoardEditReceiptRequest {
  string board_id = 1;
  string command_id = 2;
}

message GetBoardEditReceiptResponse {
  BoardEditReceipt receipt = 1;
}
